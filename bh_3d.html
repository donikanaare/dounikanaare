<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブラックホール 3D構造図</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000008;
    color: #e0e8ff;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  canvas { display: block; }

  /* UI overlay */
  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #title {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  #title h1 {
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #a0c4ff;
    text-shadow: 0 0 20px rgba(100,160,255,0.8);
  }
  #title p {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(9px, 1.2vw, 11px);
    color: #4a6fa0;
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* Legend */
  #legend {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: clamp(10px, 2vw, 24px);
    flex-wrap: wrap;
    justify-content: center;
    background: rgba(0,0,20,0.6);
    border: 1px solid rgba(100,160,255,0.15);
    border-radius: 8px;
    padding: 10px 16px;
    backdrop-filter: blur(4px);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(9px, 1.3vw, 12px);
    color: #8aa8d0;
    white-space: nowrap;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .line-sample {
    width: 18px; height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Labels */
  .label-3d {
    position: absolute;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(9px, 1.3vw, 12px);
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.3s;
  }

  #hint {
    position: absolute;
    top: 80px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(9px, 1.1vw, 11px);
    color: #3a5070;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div id="canvas-container"><canvas id="c"></canvas></div>
<div id="ui">
  <div id="title">
    <h1>ブラックホール　構造図</h1>
    <p>RELATIVISTIC JET · ACCRETION DISK · EVENT HORIZON · ERGOSPHERE</p>
  </div>
  <div id="hint">ドラッグで回転　／　スクロールでズーム</div>
  <div id="legend">
    <div class="legend-item"><div class="dot" style="background:#111122;border:2px solid #2244aa;"></div>事象の地平線</div>
    <div class="legend-item"><div class="dot" style="background:rgba(80,120,255,0.15);border:2px solid rgba(80,120,255,0.4);"></div>エルゴ球</div>
    <div class="legend-item"><div class="line-sample" style="background:linear-gradient(90deg,#ff6600,#ffaa00);"></div>降着円盤</div>
    <div class="legend-item"><div class="line-sample" style="background:linear-gradient(90deg,#00ccff,#0066ff);"></div>相対論的ジェット</div>
    <div class="legend-item"><div class="line-sample" style="background:rgba(255,255,255,0.4);"></div>自転軸</div>
    <div class="legend-item"><div class="line-sample" style="background:rgba(255,200,100,0.4);"></div>赤道面</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- Scene Setup ----
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000008, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 22);
camera.lookAt(0, 0, 0);

// ---- Lighting ----
scene.add(new THREE.AmbientLight(0x111133, 1));
const pointLight = new THREE.PointLight(0x4488ff, 2, 40);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);
const diskLight = new THREE.PointLight(0xff6600, 1.5, 20);
diskLight.position.set(5, 0, 0);
scene.add(diskLight);

// ---- Stars ----
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 2000; i++) {
  starPos.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaabbff, size: 0.12, transparent: true, opacity: 0.6 })));

// ---- Event Horizon (BH本体) ----
const bhGeo = new THREE.SphereGeometry(1.5, 64, 64);
const bhMat = new THREE.MeshStandardMaterial({
  color: 0x000011,
  emissive: 0x000022,
  roughness: 0.1,
  metalness: 0.9,
});
const bh = new THREE.Mesh(bhGeo, bhMat);
scene.add(bh);

// BH rim glow
const rimGeo = new THREE.SphereGeometry(1.52, 64, 64);
const rimMat = new THREE.MeshBasicMaterial({
  color: 0x2244cc,
  wireframe: false,
  transparent: true,
  opacity: 0.15,
  side: THREE.BackSide
});
scene.add(new THREE.Mesh(rimGeo, rimMat));

// ---- Ergosphere ----
const ergoGeo = new THREE.SphereGeometry(2.4, 64, 64);
const ergoMat = new THREE.MeshBasicMaterial({
  color: 0x3355ff,
  transparent: true,
  opacity: 0.07,
  side: THREE.DoubleSide
});
scene.add(new THREE.Mesh(ergoGeo, ergoMat));

// Ergosphere wireframe
const ergoWire = new THREE.Mesh(
  new THREE.SphereGeometry(2.41, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0x3355ff, wireframe: true, transparent: true, opacity: 0.12 })
);
scene.add(ergoWire);

// ---- Accretion Disk ----
function makeAccretionDisk() {
  const group = new THREE.Group();
  const segments = 128;
  for (let ring = 0; ring < 18; ring++) {
    const r = 2.6 + ring * 0.55;
    const thickness = 0.06 + ring * 0.015;
    const geo = new THREE.TorusGeometry(r, thickness, 12, segments);
    // Color: inner orange → outer red-brown
    const t = ring / 17;
    const col = new THREE.Color().setHSL(0.08 - t * 0.04, 1.0, 0.55 - t * 0.2);
    const mat = new THREE.MeshStandardMaterial({
      color: col,
      emissive: col,
      emissiveIntensity: 1.2 - t * 0.8,
      transparent: true,
      opacity: 0.85 - t * 0.3,
      roughness: 0.3,
    });
    group.add(new THREE.Mesh(geo, mat));
  }
  return group;
}
const disk = makeAccretionDisk();
scene.add(disk);

// ---- Jets ----
function makeJet(direction) {
  const group = new THREE.Group();
  // Core beam
  const coreGeo = new THREE.CylinderGeometry(0.05, 0.22, 14, 32, 1, true);
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0x44ddff,
    transparent: true,
    opacity: 0.9,
    side: THREE.DoubleSide
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.y = 7 * direction;
  group.add(core);

  // Outer glow cone
  const glowGeo = new THREE.CylinderGeometry(0.01, 0.6, 14, 32, 1, true);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x0088ff,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.y = 7 * direction;
  group.add(glow);

  // Particle stream
  const pCount = 120;
  const pGeo = new THREE.BufferGeometry();
  const pPos = [];
  for (let i = 0; i < pCount; i++) {
    const t = Math.random();
    const y = t * 14 * direction;
    const spread = t * 0.3;
    const angle = Math.random() * Math.PI * 2;
    pPos.push(Math.cos(angle)*spread, y, Math.sin(angle)*spread);
  }
  pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
  group.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
    color: 0x88eeff, size: 0.12, transparent: true, opacity: 0.8
  })));

  return group;
}
const jetUp = makeJet(1);
const jetDown = makeJet(-1);
scene.add(jetUp);
scene.add(jetDown);

// ---- Rotation Axis ----
const axisGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0, -18, 0),
  new THREE.Vector3(0, 18, 0)
]);
scene.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.25
})));

// Axis arrow tips
function arrowTip(y) {
  const geo = new THREE.ConeGeometry(0.15, 0.6, 16);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.5 }));
  mesh.position.y = y;
  if (y < 0) mesh.rotation.z = Math.PI;
  return mesh;
}
scene.add(arrowTip(18.3));
scene.add(arrowTip(-18.3));

// ---- Equatorial Plane ----
const eqGeo = new THREE.RingGeometry(1.5, 12, 128);
const eqMat = new THREE.MeshBasicMaterial({
  color: 0xffcc44,
  transparent: true,
  opacity: 0.06,
  side: THREE.DoubleSide
});
scene.add(new THREE.Mesh(eqGeo, eqMat));

// Equatorial ring border
const eqRingGeo = new THREE.TorusGeometry(12, 0.03, 8, 128);
scene.add(new THREE.Mesh(eqRingGeo, new THREE.MeshBasicMaterial({
  color: 0xffcc44, transparent: true, opacity: 0.3
})));

// ---- Magnetic Field Lines ----
function makeMagneticLines() {
  const group = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const points = [];
    for (let t = 0; t <= 1; t += 0.02) {
      const y = (t - 0.5) * 28;
      const absT = Math.abs(t - 0.5);
      const r = 2.5 * Math.sin(Math.PI * t) + (1 - absT * 2) * 0.3;
      points.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    group.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0x224488, transparent: true, opacity: 0.25
    })));
  }
  return group;
}
scene.add(makeMagneticLines());

// ---- Orbit Controls (manual) ----
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.3, phi: 1.1, radius: 22 };

function updateCamera() {
  camera.position.set(
    spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    spherical.radius * Math.cos(spherical.phi),
    spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}
updateCamera();

canvas.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  spherical.theta -= dx * 0.008;
  spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * 0.008));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
canvas.addEventListener('wheel', e => {
  spherical.radius = Math.max(8, Math.min(50, spherical.radius + e.deltaY * 0.04));
  updateCamera();
});

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => { lastTouch = e.touches[0]; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const dx = t.clientX - lastTouch.clientX;
  const dy = t.clientY - lastTouch.clientY;
  spherical.theta -= dx * 0.01;
  spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * 0.01));
  lastTouch = t;
  updateCamera();
}, { passive: false });

// ---- Resize ----
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---- Animate ----
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.012;

  // Disk rotation
  disk.rotation.y = t * 0.4;

  // Ergosphere slow spin
  ergoWire.rotation.y = t * 0.1;
  ergoWire.rotation.x = Math.sin(t * 0.05) * 0.05;

  // Jet particle shimmer
  jetUp.children.forEach((c, i) => { if (i === 2) c.rotation.y = t * 0.8; });
  jetDown.children.forEach((c, i) => { if (i === 2) c.rotation.y = -t * 0.8; });

  // BH pulse
  const pulse = 1 + Math.sin(t * 0.7) * 0.01;
  bh.scale.set(pulse, pulse, pulse);

  // Disk light orbit
  diskLight.position.set(Math.cos(t * 0.6) * 5, Math.sin(t * 0.3) * 0.5, Math.sin(t * 0.6) * 5);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
