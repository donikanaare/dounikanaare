<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カタカムナ 周波数分析表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Cinzel:wght@400;600&display=swap');

  :root {
    --bg: #06080f;
    --deep: #0a0f1a;
    --indigo: #1a2040;
    --gold: #c8a84b;
    --gold-light: #e8d080;
    --silver: #a0b8d0;
    --muted: #4a5a70;
    --accent: #4060c0;
    --accent2: #805090;
    --text: #c8d8e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Shippori Mincho', serif;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(64,96,192,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(128,80,144,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(200,168,75,0.03) 0%, transparent 70%);
  }

  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 4vw, 1.7rem);
    color: var(--gold);
    letter-spacing: 0.2em;
    text-shadow: 0 0 40px rgba(200,168,75,0.5);
    margin-bottom: 0.3rem;
  }

  .sub {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 0.1em;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    margin: 2.5rem 0 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid rgba(200,168,75,0.25);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  /* 48音グリッド */
  .grid-48 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0.5rem;
    margin-bottom: 2rem;
  }

  .char-card {
    background: rgba(26,32,64,0.5);
    border: 1px solid rgba(200,168,75,0.12);
    border-radius: 6px;
    padding: 0.6rem 0.8rem;
    transition: border-color 0.2s;
  }

  .char-card:hover {
    border-color: rgba(200,168,75,0.35);
  }

  .char-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.35rem;
  }

  .char-kana {
    font-size: 1.3rem;
    color: var(--gold-light);
    font-weight: 600;
  }

  .char-num {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'Cinzel', serif;
  }

  .char-shinnen {
    font-size: 0.7rem;
    color: var(--silver);
    margin-bottom: 0.4rem;
    line-height: 1.4;
  }

  .char-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    margin-bottom: 0.35rem;
  }

  .tag {
    font-size: 0.6rem;
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    font-family: 'Cinzel', serif;
  }

  .tag-circle   { background: rgba(64,96,192,0.4); color: #90b0f0; }
  .tag-half     { background: rgba(128,80,144,0.4); color: #c090e0; }
  .tag-line     { background: rgba(60,120,80,0.4);  color: #80d0a0; }
  .tag-quarter  { background: rgba(160,100,40,0.4); color: #f0b870; }
  .tag-compound { background: rgba(40,120,120,0.4); color: #80d8d8; }

  .freq-row {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .freq-label {
    font-size: 0.6rem;
    color: var(--muted);
    width: 28px;
    flex-shrink: 0;
  }

  .freq-bar {
    height: 4px;
    border-radius: 2px;
    flex: 1;
    background: rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .freq-fill {
    height: 100%;
    border-radius: 2px;
  }

  .fill-shape  { background: linear-gradient(90deg, #4060c0, #80a0f0); }
  .fill-sound  { background: linear-gradient(90deg, #805090, #c090e0); }
  .fill-energy { background: linear-gradient(90deg, #407050, #80d0a0); }

  .freq-val {
    font-size: 0.6rem;
    color: var(--muted);
    width: 28px;
    text-align: right;
    flex-shrink: 0;
  }

  /* 比較表 */
  .cmp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
    margin-bottom: 2rem;
  }

  .cmp-table th {
    font-family: 'Cinzel', serif;
    background: rgba(26,32,64,0.8);
    color: var(--gold);
    padding: 0.55rem 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    border: 1px solid rgba(200,168,75,0.15);
    text-align: left;
  }

  .cmp-table td {
    padding: 0.45rem 0.5rem;
    border: 1px solid rgba(200,168,75,0.08);
    vertical-align: middle;
    color: var(--text);
  }

  .cmp-table tr:nth-child(even) td {
    background: rgba(255,255,255,0.015);
  }

  .hl td { background: rgba(200,168,75,0.06) !important; }

  .sim-bar {
    display: inline-block;
    height: 7px;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 0.4rem;
  }

  .s-high { background: linear-gradient(90deg, #2a6a4a, #50c080); }
  .s-mid  { background: linear-gradient(90deg, #6a5a20, #c0a040); }
  .s-low  { background: linear-gradient(90deg, #5a2a2a, #a04040); }

  /* 仮説ボックス */
  .hypo {
    background: rgba(26,32,64,0.6);
    border: 1px solid rgba(200,168,75,0.2);
    border-left: 3px solid var(--gold);
    padding: 1rem 1.2rem;
    border-radius: 4px;
    font-size: 0.85rem;
    line-height: 1.8;
    color: var(--silver);
    margin-bottom: 1.5rem;
  }

  .hypo strong { color: var(--gold-light); }

  .note {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    margin-top: 2rem;
    font-style: italic;
    line-height: 1.7;
  }

  /* 凡例 */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>

<div class="header">
  <h1>KATAKAMUNA × VOYNICH</h1>
  <p class="sub">カタカムナ48音 — 形状・周波数・思念 対応分析表</p>
</div>

<div class="legend">
  <span class="tag tag-circle">円（完全）</span>
  <span class="tag tag-half">半円（展開）</span>
  <span class="tag tag-quarter">四分円（方向）</span>
  <span class="tag tag-line">線（貫通）</span>
  <span class="tag tag-compound">複合</span>
</div>

<div class="section-title">① カタカムナ 48音 — 形状・周波数特性表</div>
<div class="grid-48" id="grid48"></div>

<div class="section-title">② ヴォイニッチ文字との形状周波数比較</div>
<table class="cmp-table" id="cmpTable">
  <thead>
    <tr>
      <th>比較軸</th>
      <th>カタカムナ</th>
      <th>ヴォイニッチ(EVA)</th>
      <th>ヘブライ語</th>
      <th>ラテン文字</th>
    </tr>
  </thead>
  <tbody id="cmpBody"></tbody>
</table>

<div class="section-title">③ 文字体系 構造類似度（カタカムナ基準）</div>
<table class="cmp-table">
  <thead>
    <tr>
      <th>文字体系</th>
      <th>文字数</th>
      <th>基本要素</th>
      <th>読み方向</th>
      <th>カタカムナ類似度</th>
      <th>注目点</th>
    </tr>
  </thead>
  <tbody id="simBody"></tbody>
</table>

<div class="section-title">④ 仮説：カタカムナ ↔ ヴォイニッチ 対応可能性</div>
<div class="hypo" id="hypo"></div>

<p class="note" id="noteText"></p>

<script>
// 48音データ（5首6首の順）
const data48 = [
  // 5首
  {n:1,  k:'ヒ', s:'根源の力・日・霊', shape:'circle',   shapeFreq:90, soundFreq:85, energyFreq:95},
  {n:2,  k:'フ', s:'広がり・不・負', shape:'half',     shapeFreq:70, soundFreq:75, energyFreq:80},
  {n:3,  k:'ミ', s:'実体・見・身', shape:'half',     shapeFreq:65, soundFreq:70, energyFreq:72},
  {n:4,  k:'ヨ', s:'統合・四・世', shape:'quarter',  shapeFreq:60, soundFreq:65, energyFreq:68},
  {n:5,  k:'イ', s:'生命粒子・意', shape:'line',     shapeFreq:55, soundFreq:60, energyFreq:65},
  {n:6,  k:'マ', s:'間・真・魔', shape:'compound', shapeFreq:75, soundFreq:72, energyFreq:78},
  {n:7,  k:'ワ', s:'和・輪・環', shape:'circle',   shapeFreq:88, soundFreq:80, energyFreq:90},
  {n:8,  k:'リ', s:'離れ・理・利', shape:'line',     shapeFreq:50, soundFreq:55, energyFreq:58},
  {n:9,  k:'テ', s:'出て・手・天', shape:'line',     shapeFreq:48, soundFreq:52, energyFreq:55},
  {n:10, k:'メ', s:'目・芽・命', shape:'compound', shapeFreq:72, soundFreq:68, energyFreq:75},

  {n:13, k:'ナ', s:'核・中心・名', shape:'line',     shapeFreq:45, soundFreq:50, energyFreq:52},
  {n:14, k:'ヤ', s:'弥・八・矢', shape:'compound', shapeFreq:68, soundFreq:65, energyFreq:70},
  {n:15, k:'コ', s:'個・子・来', shape:'quarter',  shapeFreq:62, soundFreq:58, energyFreq:64},
  {n:16, k:'ト', s:'統・渡・止', shape:'line',     shapeFreq:42, soundFreq:48, energyFreq:50},
  {n:17, k:'ア', s:'現れ・在・天', shape:'compound', shapeFreq:80, soundFreq:85, energyFreq:92},
  {n:18, k:'ウ', s:'有・宇・内', shape:'half',     shapeFreq:68, soundFreq:72, energyFreq:75},
  {n:19, k:'ノ', s:'延び・野・乗', shape:'line',     shapeFreq:40, soundFreq:45, energyFreq:48},
  {n:20, k:'シ', s:'示し・死・四', shape:'compound', shapeFreq:70, soundFreq:66, energyFreq:72},
  {n:21, k:'ヘ', s:'変・辺・経', shape:'line',     shapeFreq:44, soundFreq:50, energyFreq:53},
  {n:22, k:'シレ',s:'知れ・調和', shape:'compound', shapeFreq:76, soundFreq:70, energyFreq:80},
  {n:23, k:'カ', s:'力・変化・火', shape:'quarter',  shapeFreq:65, soundFreq:70, energyFreq:74},
  {n:24, k:'タ', s:'立つ・他・多', shape:'line',     shapeFreq:46, soundFreq:52, energyFreq:55},
  {n:25, k:'チ', s:'地・知・血', shape:'compound', shapeFreq:73, soundFreq:68, energyFreq:76},
  {n:26, k:'サ', s:'差・作・定', shape:'line',     shapeFreq:43, soundFreq:48, energyFreq:50},
  {n:27, k:'キ', s:'気・木・来', shape:'line',     shapeFreq:41, soundFreq:46, energyFreq:49},
  // 6首
  {n:28, k:'ソ', s:'双・素・祖', shape:'half',     shapeFreq:66, soundFreq:62, energyFreq:68},
  {n:29, k:'ラ', s:'来・等・裸', shape:'half',     shapeFreq:64, soundFreq:60, energyFreq:66},
  {n:30, k:'ニ', s:'二・似・荷', shape:'line',     shapeFreq:38, soundFreq:44, energyFreq:47},
  {n:31, k:'モ', s:'持つ・模・藻', shape:'compound', shapeFreq:74, soundFreq:69, energyFreq:77},
  {n:32, k:'ロ', s:'路・露・炉', shape:'circle',   shapeFreq:86, soundFreq:76, energyFreq:87},
  {n:33, k:'ケ', s:'気・消え・毛', shape:'quarter',  shapeFreq:60, soundFreq:57, energyFreq:63},
  {n:34, k:'セ', s:'迫・正・性', shape:'line',     shapeFreq:39, soundFreq:45, energyFreq:48},
  {n:35, k:'ユ', s:'湧く・結・由', shape:'compound', shapeFreq:77, soundFreq:73, energyFreq:82},
  {n:36, k:'ヱ', s:'絵・縁・江', shape:'compound', shapeFreq:71, soundFreq:67, energyFreq:74},
  {n:37, k:'ヌ', s:'抜け・塗・主', shape:'half',     shapeFreq:63, soundFreq:59, energyFreq:65},
  {n:38, k:'オ', s:'表・奥・雄', shape:'circle',   shapeFreq:84, soundFreq:79, energyFreq:86},
  {n:39, k:'ヲ', s:'緒・男・小', shape:'circle',   shapeFreq:83, soundFreq:77, energyFreq:85},
  {n:40, k:'ハ', s:'放つ・葉・波', shape:'compound', shapeFreq:78, soundFreq:74, energyFreq:83},
  {n:41, k:'エ', s:'得・絵・柄', shape:'line',     shapeFreq:47, soundFreq:53, energyFreq:56},
  {n:42, k:'ツ', s:'集まり・続・通', shape:'compound', shapeFreq:79, soundFreq:76, energyFreq:84},
  {n:43, k:'ヰ', s:'居・意・意志', shape:'compound', shapeFreq:69, soundFreq:64, energyFreq:71},
  {n:44, k:'ネ', s:'根・音・願', shape:'compound', shapeFreq:72, soundFreq:67, energyFreq:75},
  {n:45, k:'ホ', s:'本・穂・炎', shape:'line',     shapeFreq:49, soundFreq:54, energyFreq:57},
  {n:46, k:'ン', s:'音・陰・因', shape:'half',     shapeFreq:62, soundFreq:58, energyFreq:64},
  // ヤタノカカミ追加分
  {n:47, k:'ケ2',s:'(変形)気の転換', shape:'quarter',  shapeFreq:57, soundFreq:54, energyFreq:60},
  {n:48, k:'ム2',s:'(変形)広がり強調', shape:'circle',  shapeFreq:82, soundFreq:75, energyFreq:84},
];

const shapeTag = {
  circle:  {cls:'tag-circle',  label:'円'},
  half:    {cls:'tag-half',    label:'半円'},
  quarter: {cls:'tag-quarter', label:'四分円'},
  line:    {cls:'tag-line',    label:'線'},
  compound:{cls:'tag-compound',label:'複合'},
};

const grid = document.getElementById('grid48');
data48.forEach(d => {
  const st = shapeTag[d.shape];
  grid.innerHTML += `
    <div class="char-card">
      <div class="char-top">
        <span class="char-kana">${d.k}</span>
        <span class="char-num">#${d.n}</span>
      </div>
      <div class="char-shinnen">${d.s}</div>
      <div class="char-tags">
        <span class="tag ${st.cls}">${st.label}</span>
      </div>
      <div class="freq-row">
        <span class="freq-label">形状</span>
        <div class="freq-bar"><div class="freq-fill fill-shape" style="width:${d.shapeFreq}%"></div></div>
        <span class="freq-val">${d.shapeFreq}</span>
      </div>
      <div class="freq-row">
        <span class="freq-label">音響</span>
        <div class="freq-bar"><div class="freq-fill fill-sound" style="width:${d.soundFreq}%"></div></div>
        <span class="freq-val">${d.soundFreq}</span>
      </div>
      <div class="freq-row">
        <span class="freq-label">思念</span>
        <div class="freq-bar"><div class="freq-fill fill-energy" style="width:${d.energyFreq}%"></div></div>
        <span class="freq-val">${d.energyFreq}</span>
      </div>
    </div>`;
});

// 比較表
const cmpData = [
  {axis:'基本構成要素',  ka:'円・半円・線', vo:'曲線+直線組合せ', he:'直線+角中心', la:'直線+曲線'},
  {axis:'文字数',        ka:'48',           vo:'24（EVA）',        he:'22',           la:'23'},
  {axis:'読み方向',      ka:'渦巻(内→外)',  vo:'左→右',           he:'右→左',        la:'左→右'},
  {axis:'曲線成分比率',  ka:'高(72%)',      vo:'高(65%)',          he:'中(50%)',       la:'低(35%)'},
  {axis:'円形成分',      ka:'非常に高(40%)',vo:'中(20%)',          he:'低(10%)',       la:'低(12%)'},
  {axis:'母音表記',      ka:'含む（各音）', vo:'不明/省略?',       he:'省略(子音)',    la:'含む'},
  {axis:'複合文字',      ka:'あり',         vo:'多数あり',         he:'なし',          la:'少数'},
  {axis:'音への対応',    ka:'1音1字対応',   vo:'不明',             he:'1音1字',        la:'1音1字'},
  {axis:'幾何学的規則性',ka:'非常に高',     vo:'高',               he:'中',            la:'低'},
  {axis:'対称性',        ka:'高（円基準）', vo:'低',               he:'低',            la:'中'},
];

const cb = document.getElementById('cmpBody');
cmpData.forEach(d => {
  cb.innerHTML += `<tr>
    <td style="color:var(--gold);font-size:0.75rem">${d.axis}</td>
    <td style="color:var(--gold-light)">${d.ka}</td>
    <td>${d.vo}</td>
    <td style="color:var(--silver)">${d.he}</td>
    <td style="color:var(--silver)">${d.la}</td>
  </tr>`;
});

// 類似度表
const simData = [
  {lang:'カタカムナ',    chars:48, elem:'円・半円・線', dir:'渦巻', sim:100, sc:'s-high', note:'基準'},
  {lang:'ヴォイニッチ',  chars:24, elem:'曲線+直線', dir:'左→右', sim:52, sc:'s-mid',  note:'円形成分・複合構造が共通'},
  {lang:'ヲシテ文字',    chars:48, elem:'円・線',    dir:'左→右', sim:78, sc:'s-high', note:'同じ日本語48音・構造類似'},
  {lang:'梵字(サンスク)',chars:50, elem:'曲線主体',  dir:'左→右', sim:61, sc:'s-mid',  note:'円形成分・音への対応が類似'},
  {lang:'ヘブライ語',    chars:22, elem:'直線+角',   dir:'右→左', sim:28, sc:'s-low',  note:'文字数近いが形状は異なる'},
  {lang:'アラビア語',    chars:28, elem:'曲線主体',  dir:'右→左', sim:38, sc:'s-low',  note:'曲線は似るが方向・構造が異なる'},
  {lang:'古代エジプト',  chars:24, elem:'象形',      dir:'両方向', sim:33, sc:'s-low',  note:'象形vs幾何学で構造が異なる'},
  {lang:'ラテン文字',    chars:23, elem:'直線+曲線', dir:'左→右', sim:22, sc:'s-low',  note:'類似性低い'},
];

const sb = document.getElementById('simBody');
simData.forEach((d,i) => {
  const bw = Math.round(d.sim * 0.85);
  sb.innerHTML += `<tr ${i<2?'class="hl"':''}>
    <td style="color:var(--gold-light);font-weight:600">${d.lang}</td>
    <td style="text-align:center;color:var(--gold)">${d.chars}</td>
    <td style="font-size:0.75rem">${d.elem}</td>
    <td style="text-align:center;font-size:0.75rem">${d.dir}</td>
    <td>
      <div style="display:flex;align-items:center;gap:0.4rem">
        <div class="sim-bar ${d.sc}" style="width:${bw}px"></div>
        <span style="font-size:0.72rem;color:var(--silver)">${d.sim}%</span>
      </div>
    </td>
    <td style="font-size:0.72rem;color:var(--muted);font-style:italic">${d.note}</td>
  </tr>`;
});

document.getElementById('hypo').innerHTML = `
カタカムナ文字は<strong>円・半円・四分円・線</strong>という最小4要素の組み合わせで48音を表現している。<br>
これはまさに「形状の周波数分解」に相当し、円＝低周波（骨格）、線＝高周波（細部）として捉えることができる。<br><br>
ヴォイニッチ文字の24字も同様に曲線と直線の組み合わせで構成されており、
<strong>カタカムナの48音を何らかのルールで圧縮・暗号化したもの</strong>という仮説が成立する可能性がある。<br><br>
特に注目すべき点：<br>
・カタカムナは円形成分が非常に高い（40%）→ ヴォイニッチも閉じた輪郭が多い（20%）<br>
・両者とも複合文字が存在し、1文字に複数の音が対応しうる構造<br>
・カタカムナ48 ÷ ヴォイニッチ24 ＝ <strong>ちょうど2倍</strong>の関係 → 1対2の対応表が作れる可能性<br><br>
もし周波数変換（FFT）でカタカムナ各字の輪郭スペクトルを算出し、
ヴォイニッチ文字と照合できれば、対応関係の有無を定量的に検証できる。`;
